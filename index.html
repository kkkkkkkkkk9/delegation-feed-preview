<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="darkreader-lock">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>delegationapp · Instagram preview</title>
<style>
  :root {
    color-scheme: light dark;
    --bg:#f3f3f1; --panel:#ffffff; --text:#000; --muted:#737373; --line:#dbdbdb; --icon:#000; --tilebg:#e6e6e3;
    --ring: conic-gradient(from 210deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5, #feda75);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0c0c0c; --panel:#000; --text:#f5f5f5; --muted:#a8a8a8; --line:#262626; --icon:#f5f5f5; --tilebg:#1a1a1a; }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:var(--bg); color:var(--text); }
  body { font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased; }
  svg.i { width:24px; height:24px; fill:none; stroke:var(--icon); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; color:var(--icon); }

  .side-nav { position:fixed; left:0; top:0; bottom:0; width:72px; display:flex; flex-direction:column; align-items:center; padding:28px 0 22px; gap:34px; border-right:1px solid var(--line); background:var(--panel); z-index:5; }
  .side-nav .spacer { flex:1; }
  .side-nav .me { width:26px; height:26px; border-radius:50%; overflow:hidden; border:1px solid var(--line); }
  .side-nav .me img { width:100%; height:100%; object-fit:cover; }

  .page { display:flex; justify-content:center; padding:36px 24px 80px; }
  .container { width:100%; max-width:1390px; }

  .profile { display:flex; justify-content:center; gap:48px; align-items:flex-start; padding:10px 0 44px; }
  .ring { padding:4px; border-radius:50%; background:var(--ring); flex:none; }
  .ring .gap { padding:4px; border-radius:50%; background:var(--bg); }
  .avatar { border-radius:50%; overflow:hidden; display:block; }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; }
  .profile .avatar { width:168px; height:168px; }
  .meta { min-width:320px; max-width:440px; padding-top:6px; }
  .uname { display:flex; align-items:center; gap:10px; font-size:24px; font-weight:600; letter-spacing:-.2px; }
  .uname .dots { font-size:20px; letter-spacing:1px; }
  .fullname { font-size:15px; margin:6px 0 16px; }
  .bio { font-size:15px; line-height:1.45; }
  .bio .link { display:flex; align-items:center; gap:6px; margin-top:6px; font-weight:600; color:var(--text); text-decoration:none; }
  .bio .link svg { width:16px; height:16px; }

  .grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:3px; }
  .tile { position:relative; aspect-ratio:3/4; overflow:hidden; cursor:pointer; background:var(--tilebg); }
  .tile img { width:100%; height:100%; object-fit:cover; display:block; }
  .tile .multi { position:absolute; top:10px; right:10px; width:20px; height:20px; filter:drop-shadow(0 0 3px rgba(0,0,0,.35)); }
  .tile .multi path { fill:#fff; }
  .tile:hover::after { content:""; position:absolute; inset:0; background:rgba(0,0,0,.15); }

  .mtop { display:none; }

  .modal { position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; z-index:10; }
  .modal.open { display:flex; }
  .sheet { display:grid; grid-template-columns:auto 405px; grid-template-rows:auto 1fr auto; background:var(--panel); border-radius:4px; overflow:hidden; max-width:calc(100vw - 140px); }
  .media { --w:min(calc(88vh * 0.8), 640px); grid-column:1; grid-row:1 / 4; position:relative; background:#000; width:var(--w); height:calc(var(--w) * 1.25); overflow:hidden; }
  .track { display:flex; height:100%; transition:transform .3s ease; }
  .track img { width:100%; height:100%; flex:0 0 100%; display:block; object-fit:cover; }
  .nav { position:absolute; z-index:2; top:50%; transform:translateY(-50%); width:30px; height:30px; border-radius:50%; border:0; background:rgba(255,255,255,.85); font-size:18px; line-height:30px; cursor:pointer; color:#222; }
  .nav.prev { left:12px; } .nav.next { right:12px; }
  .pdots { position:absolute; bottom:14px; left:0; right:0; display:flex; justify-content:center; gap:4px; }
  .pdots i { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.5); }
  .pdots i.on { background:#fff; }
  .phead { grid-column:2; grid-row:1; display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); border-left:1px solid var(--line); font-size:14px; font-weight:600; }
  .caption { grid-column:2; grid-row:2; overflow:auto; padding:16px; display:flex; gap:12px; font-size:14px; line-height:1.45; border-left:1px solid var(--line); }
  .caption b { font-weight:600; margin-right:4px; }
  .pact { grid-column:2; grid-row:3; border-top:1px solid var(--line); border-left:1px solid var(--line); padding:10px 16px 14px; }
  .pact .row { display:flex; gap:16px; }
  .pact small { display:block; font-size:12px; color:var(--muted); margin-top:8px; }
  .mini { width:34px; height:34px; flex:none; }
  .mini.ring { padding:2px; } .mini.ring .gap { padding:2px; background:var(--panel); }
  .mini .avatar { width:100%; height:100%; }
  .close { position:fixed; top:14px; right:20px; color:#fff; font-size:34px; background:none; border:0; cursor:pointer; z-index:11; }
  .postnav { position:fixed; top:50%; transform:translateY(-50%); color:#fff; font-size:44px; background:none; border:0; cursor:pointer; padding:10px; }
  .postnav.l { left:6px; } .postnav.r { right:6px; }

  @media (max-width:735px) {
    .side-nav { display:none; }
    .page { margin-left:0; padding:0 0 40px; }
    .mtop { display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:4; background:var(--bg); padding:12px 14px; font-size:20px; font-weight:700; }
    .mtop .u { flex:1; }
    .profile { display:grid; grid-template-columns:auto 1fr; gap:6px 18px; padding:8px 16px 18px; align-items:center; justify-content:start; }
    .profile .avatar { width:84px; height:84px; }
    .profile .ring { padding:3px; } .profile .ring .gap { padding:3px; }
    .meta { display:contents; }
    .uname { display:none; }
    .fullname { font-size:16px; font-weight:600; margin:0; }
    .bio { grid-column:1 / -1; font-size:15px; margin-top:8px; }
    .grid { grid-template-columns:repeat(3, 1fr); gap:2px; }
    .tile .multi { top:8px; right:8px; width:18px; height:18px; }
    .modal { background:var(--panel); align-items:flex-start; overflow:auto; }
    .sheet { display:flex; flex-direction:column; max-width:none; width:100%; border-radius:0; }
    .phead { order:0; border:0; padding:12px 14px; }
    .media { order:1; --w:100vw; width:100%; height:calc(100vw * 1.25); }
    .pact { order:2; border:0; padding:10px 14px 0; }
    .caption { order:3; border:0; padding:8px 14px 24px; }
    .caption .mini { display:none; }
    .close { color:var(--text); top:8px; right:12px; }
    .postnav { display:none; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="ig" viewBox="0 0 24 24"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="17.6" cy="6.4" r=".9" fill="currentColor"/></symbol>
  <symbol id="home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="reels" viewBox="0 0 24 24"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><path d="M10 8.5v7l6-3.5z"/></symbol>
  <symbol id="send" viewBox="0 0 24 24"><path d="M21.5 3 10 14.5M21.5 3 15 21l-5-6.5L3 9z"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5"/><path d="m21 21-4.6-4.6"/></symbol>
  <symbol id="heart" viewBox="0 0 24 24"><path d="M12 20.5s-8-4.6-8-10.4A4.4 4.4 0 0 1 12 7.6a4.4 4.4 0 0 1 8 2.5c0 5.8-8 10.4-8 10.4z"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
  <symbol id="menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
  <symbol id="back" viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></symbol>
  <symbol id="bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"/></symbol>
  <symbol id="more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="19" cy="12" r="1.2" fill="currentColor"/></symbol>
  <symbol id="link" viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3A4.5 4.5 0 0 0 13 4.6l-1 1M14 10a4.5 4.5 0 0 0-6.4 0l-3 3A4.5 4.5 0 0 0 11 19.4l1-1"/></symbol>
  <symbol id="comment" viewBox="0 0 24 24"><path d="M20.5 12A8.5 8.5 0 1 1 17 5.1 8.5 8.5 0 0 1 20.5 12zm0 0V21l-3-2.3"/></symbol>
  <symbol id="save" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V3h14z"/></symbol>
</svg>


<div class="page"><div class="container">
  <div class="mtop">
    <svg class="i"><use href="#back"/></svg>
    <span class="u">delegationapp</span>
    <svg class="i"><use href="#bell"/></svg>
    <svg class="i"><use href="#more"/></svg>
  </div>

  <header class="profile">
    <div class="ring"><div class="gap"><span class="avatar"><img src="img/avatar.png" alt=""></span></div></div>
    <div class="meta">
      <div class="uname">delegationapp <span class="dots">···</span></div>
      <div class="fullname">Delegation</div>
      <div class="bio">
        The friends &amp; family packing app.<br>
        Enjoy family trips, knowing everyone has what they need.
        <a class="link" href="https://delegation.app" target="_blank"><svg class="i"><use href="#link"/></svg>delegation.app</a>
      </div>
    </div>
  </header>

  <main class="grid" id="grid"></main>
</div></div>

<div class="modal" id="modal">
  <button class="close" id="close" aria-label="Close">×</button>
  <button class="postnav l" id="pPrev" aria-label="Previous post">‹</button>
  <div class="sheet">
    <div class="phead"><div class="mini ring"><div class="gap"><span class="avatar"><img src="img/avatar.png" alt=""></span></div></div>delegationapp</div>
    <div class="media" id="media">
      <div class="track" id="track"></div>
      <button class="nav prev" id="prev">‹</button>
      <button class="nav next" id="next">›</button>
      <div class="pdots" id="dots"></div>
    </div>
    <div class="caption"><div class="mini"><span class="avatar"><img src="img/avatar.png" alt=""></span></div><div id="cap"></div></div>
    <div class="pact"><div class="row"><svg class="i"><use href="#heart"/></svg><svg class="i"><use href="#comment"/></svg><svg class="i"><use href="#send"/></svg><span style="flex:1"></span><svg class="i"><use href="#save"/></svg></div><small id="num"></small></div>
  </div>
  <button class="postnav r" id="pNext" aria-label="Next post">›</button>
</div>

<script src="data.js"></script>
<script>
const P = window.POSTS;
const grid = document.getElementById('grid');
const multiSvg = '<svg class="multi" viewBox="0 0 48 48"><path d="M34.8 29.7V11c0-2.9-2.3-5.2-5.2-5.2H11c-2.9 0-5.2 2.3-5.2 5.2v18.7c0 2.9 2.3 5.2 5.2 5.2h18.7c2.8-.1 5.1-2.4 5.1-5.2zM39.2 15v16.1c0 4.5-3.7 8.2-8.2 8.2H14.9c-.6 0-.9.7-.5 1.1 1 1.1 2.4 1.8 4.1 1.8h13.4c5.7 0 10.3-4.6 10.3-10.3V18.5c0-1.6-.7-3.1-1.8-4.1-.5-.4-1.2 0-1.2.6z"/></svg>';
P.forEach((p, i) => {
  const t = document.createElement('div'); t.className = 'tile';
  t.innerHTML = '<img loading="lazy" src="' + p.slides[0] + '" alt="">' + (p.slides.length > 1 ? multiSvg : '');
  t.onclick = () => open(i); grid.appendChild(t);
});
const modal = document.getElementById('modal'), track = document.getElementById('track'), dots = document.getElementById('dots');
let cur = 0, slide = 0;
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function render() {
  const p = P[cur];
  track.innerHTML = p.slides.map(s => '<img src="' + s + '" alt="">').join('');
  dots.innerHTML = p.slides.length > 1 ? p.slides.map(() => '<i></i>').join('') : '';
  document.getElementById('cap').innerHTML = '<b>delegationapp</b>' + esc(p.caption);
  document.getElementById('num').textContent = 'Post ' + (P.length - cur) + ' of ' + P.length + ' in posting order';
  slide = 0; move();
}
function move() {
  const n = P[cur].slides.length;
  track.style.transform = 'translateX(' + (-100 * slide) + '%)';
  document.getElementById('prev').style.display = slide > 0 ? '' : 'none';
  document.getElementById('next').style.display = slide < n - 1 ? '' : 'none';
  [...dots.children].forEach((d, k) => d.className = k === slide ? 'on' : '');
}
function open(i) { cur = i; render(); modal.classList.add('open'); modal.scrollTop = 0; document.body.style.overflow = 'hidden'; }
function shut() { modal.classList.remove('open'); document.body.style.overflow = ''; }
document.getElementById('close').onclick = shut;
modal.onclick = e => { if (e.target === modal) shut(); };
document.getElementById('prev').onclick = () => { if (slide > 0) { slide--; move(); } };
document.getElementById('next').onclick = () => { if (slide < P[cur].slides.length - 1) { slide++; move(); } };
document.getElementById('pPrev').onclick = () => { if (cur > 0) { cur--; render(); } };
document.getElementById('pNext').onclick = () => { if (cur < P.length - 1) { cur++; render(); } };
document.addEventListener('keydown', e => {
  if (!modal.classList.contains('open')) return;
  if (e.key === 'Escape') shut();
  if (e.key === 'ArrowRight') { if (slide < P[cur].slides.length - 1) { slide++; move(); } else if (cur < P.length - 1) { cur++; render(); } }
  if (e.key === 'ArrowLeft') { if (slide > 0) { slide--; move(); } else if (cur > 0) { cur--; render(); } }
});
let x0 = null;
const media = document.getElementById('media');
media.addEventListener('touchstart', e => x0 = e.touches[0].clientX, {passive:true});
media.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (dx < -40) document.getElementById('next').click(); if (dx > 40) document.getElementById('prev').click(); x0 = null; });
</script>
</body>
</html>
